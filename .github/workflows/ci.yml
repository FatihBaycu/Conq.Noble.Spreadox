name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test Conq.Noble.Spreadox.sln -c Release --filter Category!=Perf

      - name: Pack
        run: dotnet pack src/Conq.Noble.Spreadox/Conq.Noble.Spreadox.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*
